openapi: 3.0.3
info:
  title: Trans-Schema API
  description: Generic Schema Translation Service
  version: 1.0.0
paths:
  /login:
    post:
      summary: User Login
      responses:
        '200':
          description: OK
      x-amazon-apigateway-integration:
        type: "mock"
        requestTemplates:
          application/json: "{\"statusCode\": 200}"
        responses:
          default:
            statusCode: "200"
            responseTemplates:
              application/json: "{\"message\": \"Login via Cognito recommended (Mock)\"}"
  /accounts:
    post:
      summary: Create Account
      responses:
        '201':
          description: Created
      x-amazon-apigateway-integration:
        type: "mock"
        requestTemplates:
          application/json: "{\"statusCode\": 201}"
        responses:
          default:
            statusCode: "201"
            responseTemplates:
              application/json: "{\"message\": \"Account created (Mock)\"}"

  /schemas:
    get:
      summary: List Schemas
      security:
        - CognitoAuthorizer: []
      responses:
        '200':
          description: OK
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${AWS_REGION}:dynamodb:action/Scan"
        credentials: "${APIGW_ROLE_ARN}"
        responses:
          default:
            statusCode: "200"
        httpMethod: "POST"
        type: "aws"
        requestTemplates:
          application/json: |
            {
              "TableName": "${SCHEMAS_TABLE}"
            }
    post:
      summary: Create Schema
      security:
        - CognitoAuthorizer: []
      responses:
        '201':
          description: Created
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${AWS_REGION}:dynamodb:action/PutItem"
        credentials: "${APIGW_ROLE_ARN}"
        responses:
          default:
            statusCode: "201"
        httpMethod: "POST"
        type: "aws"
        requestTemplates:
          application/json: |
            {
              "TableName": "${SCHEMAS_TABLE}",
              "Item": {
                "schemaId": { "S": "$input.path('$.schemaId')" },
                "definition": { "S": "$input.json('$.definition')" }
              }
            }

  /schemas/{schemaId}:
    get:
      summary: Get Schema
      parameters:
        - name: schemaId
          in: path
          required: true
          schema:
            type: string
      security:
        - CognitoAuthorizer: []
      responses:
        '200':
          description: OK
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${AWS_REGION}:dynamodb:action/GetItem"
        credentials: "${APIGW_ROLE_ARN}"
        responses:
          default:
            statusCode: "200"
        httpMethod: "POST"
        type: "aws"
        requestTemplates:
          application/json: |
            {
              "TableName": "${SCHEMAS_TABLE}",
              "Key": {
                "schemaId": { "S": "$input.params('schemaId')" }
              }
            }

  /records/{schemaId}:
    get:
      summary: List Records
      parameters:
        - name: schemaId
          in: path
          required: true
          schema:
            type: string
      security:
        - CognitoAuthorizer: []
      responses:
        '200':
          description: OK
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${AWS_REGION}:dynamodb:action/Query"
        credentials: "${APIGW_ROLE_ARN}"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        type: "aws"
        requestTemplates:
          application/json: |
            {
              "TableName": "${RECORDS_TABLE}",
              "KeyConditionExpression": "schemaId = :v1",
              "ExpressionAttributeValues": {
                ":v1": {
                  "S": "$input.params('schemaId')"
                }
              }
            }
    post:
      summary: Create Record
      parameters:
        - name: schemaId
          in: path
          required: true
          schema:
            type: string
      security:
        - CognitoAuthorizer: []
      responses:
        '201':
          description: Created
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${AWS_REGION}:dynamodb:action/PutItem"
        credentials: "${APIGW_ROLE_ARN}"
        responses:
          default:
            statusCode: "201"
        httpMethod: "POST"
        type: "aws"
        requestTemplates:
          application/json: |
            {
              "TableName": "${RECORDS_TABLE}",
              "Item": {
                "schemaId": { "S": "$input.params('schemaId')" },
                "id": { "S": "$input.path('$.id')" },
                "data": { "S": "$input.json('$')" }
              }
            }

  /records/{schemaId}/{id}:
    get:
      summary: Get Record
      parameters:
        - name: schemaId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - CognitoAuthorizer: []
      responses:
        '200':
          description: OK
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${AWS_REGION}:dynamodb:action/GetItem"
        credentials: "${APIGW_ROLE_ARN}"
        responses:
          default:
            statusCode: "200"
        httpMethod: "POST"
        type: "aws"
        requestTemplates:
          application/json: |
            {
              "TableName": "${RECORDS_TABLE}",
              "Key": {
                "schemaId": { "S": "$input.params('schemaId')" },
                "id": { "S": "$input.params('id')" }
              }
            }
    put:
      summary: Update Record
      parameters:
        - name: schemaId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - CognitoAuthorizer: []
      responses:
        '200':
          description: OK
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${AWS_REGION}:dynamodb:action/UpdateItem"
        credentials: "${APIGW_ROLE_ARN}"
        responses:
          default:
            statusCode: "200"
        httpMethod: "POST"
        type: "aws"
        requestTemplates:
          application/json: |
            {
              "TableName": "${RECORDS_TABLE}",
              "Key": {
                "schemaId": { "S": "$input.params('schemaId')" },
                "id": { "S": "$input.params('id')" }
              },
              "UpdateExpression": "set #d = :val",
              "ExpressionAttributeNames": { "#d": "data" },
              "ExpressionAttributeValues": {
                ":val": { "S": "$input.json('$')" }
              }
            }

  /translations:
    get:
      summary: List Translations
      security:
        - CognitoAuthorizer: []
      responses:
        '200':
          description: OK
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${AWS_REGION}:dynamodb:action/Scan"
        credentials: "${APIGW_ROLE_ARN}"
        responses:
          default:
            statusCode: "200"
        httpMethod: "POST"
        type: "aws"
        requestTemplates:
          application/json: |
            {
              "TableName": "${TRANSLATIONS_TABLE}"
            }
    post:
      summary: Create Translation
      security:
        - CognitoAuthorizer: []
      responses:
        '201':
          description: Created
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${AWS_REGION}:dynamodb:action/PutItem"
        credentials: "${APIGW_ROLE_ARN}"
        responses:
          default:
            statusCode: "201"
        httpMethod: "POST"
        type: "aws"
        requestTemplates:
          application/json: |
            {
              "TableName": "${TRANSLATIONS_TABLE}",
              "Item": {
                "translationId": { "S": "$input.path('$.translationId')" },
                "sourceSchemaId": { "S": "$input.path('$.sourceSchemaId')" },
                "targetSchemaId": { "S": "$input.path('$.targetSchemaId')" },
                "definition": { "S": "$input.json('$.definition')" }
              }
            }

  /search:
    post:
      summary: Search Records
      security:
        - CognitoAuthorizer: []
      responses:
        '200':
          description: OK
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:${AWS_REGION}:dynamodb:action/Scan"
        credentials: "${APIGW_ROLE_ARN}"
        responses:
          default:
            statusCode: "200"
        httpMethod: "POST"
        type: "aws"
        requestTemplates:
          application/json: |
            {
              "TableName": "${RECORDS_TABLE}",
              "FilterExpression": "schemaId = :s AND contains(#d, :q)",
              "ExpressionAttributeNames": { "#d": "data" },
              "ExpressionAttributeValues": {
                ":s": { "S": "$input.path('$.schemaId')" },
                ":q": { "S": "$input.path('$.query')" }
              }
            }

components:
  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - "${USER_POOL_ARN}"
