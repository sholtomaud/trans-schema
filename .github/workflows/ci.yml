name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: CDK Synth
        run: npx cdk synth --app "node --experimental-strip-types cdk/bin/cdk.ts"

      - name: Run Infrastructure Tests
        run: npm run test:infra

      - name: Run E2E Tests (Frontend)
        run: npm run test:e2e:frontend

      - name: Run E2E Tests (API Mock)
        run: npm run test:e2e:api
        env:
          API_URL: http://localhost:8080 # This is just a placeholder to ensure the tests are executed

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
